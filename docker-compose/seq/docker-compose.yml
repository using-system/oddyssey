# A throwaway Seq instance to exercise the custom stack file
# .odd/observability-stacks/seq.md: `docker compose up -d` here, then
# point seqcli at http://localhost:5341 (the stack file says how).
# Authentication is opted out (Seq refuses to start without either an
# admin password or this opt-out) - local use only, never expose it.
# Data lives in a named volume that `docker compose down -v` removes.
services:
  seq:
    image: datalust/seq:2026.1
    container_name: oddyssey-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

volumes:
  seq-data:
