name: oddyssey
version: 1.10.1
license: MIT
description: Observability-Driven Development for CLI coding agents
displayName: Oddyssey
keywords:
  - claude-code
  - claude-code-plugin
  - claude-skills
  - mcp
  - ai-agents
  - observability
  - opentelemetry
  - developer-tools
homepage: https://github.com/using-system/oddyssey#readme
repository: https://github.com/using-system/oddyssey
author:
  name: using-system
  url: https://github.com/using-system

dependencies:
  mcp:
    - name: oddyssey
      registry: false
      transport: stdio
      command: uvx
      args:
        - "oddyssey-mcp==1.10.1"

# `apm pack` compiles this block into the native marketplace manifests
# (.claude-plugin/marketplace.json for Claude Code / Copilot CLI / Kimi
# Code, .agents/plugins/marketplace.json for Codex) - regenerated by
# scripts/build-marketplace.sh on every release.
marketplace:
  name: oddyssey-plugin
  owner:
    name: using-system
    url: https://github.com/using-system
  outputs:
    claude: {}
    codex: {}
  packages:
    - name: oddyssey
      description: "Observability-Driven Development for CLI coding agents: OTel expert agent, run-observation agent, verification pass, local Grafana stack via MCP"
      source: ./marketplace/oddyssey
      version: 1.10.1
      category: Observability
