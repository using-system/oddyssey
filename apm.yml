name: oddyssey
version: 1.13.0
license: MIT
description: "CLI toolbox for Observability-Driven Development (ODD): coding agents observe local runs on an OpenTelemetry/Grafana stack - or remote ones on any OpenTelemetry backend - and feed the next spec-driven improvement loop."
displayName: Oddyssey
keywords:
  - claude-code
  - claude-code-plugin
  - claude-skills
  - mcp
  - ai-agents
  - observability
  - opentelemetry
  - developer-tools
homepage: https://github.com/using-system/oddyssey#readme
repository: https://github.com/using-system/oddyssey
author:
  name: using-system
  url: https://github.com/using-system

dependencies:
  mcp:
    - name: oddyssey
      registry: false
      transport: stdio
      command: uvx
      args:
        - "--refresh-package"
        - "oddyssey-mcp"
        - "oddyssey-mcp==1.13.0"

# `apm pack` compiles this block into the native marketplace manifests
# (.claude-plugin/marketplace.json for Claude Code / Copilot CLI / Kimi
# Code, .agents/plugins/marketplace.json for Codex) - regenerated by
# scripts/build-marketplace.sh on every release.
marketplace:
  name: oddyssey-plugin
  owner:
    name: using-system
    url: https://github.com/using-system
  outputs:
    claude: {}
    codex: {}
  packages:
    - name: oddyssey
      description: "CLI toolbox for Observability-Driven Development (ODD): coding agents observe local runs on an OpenTelemetry/Grafana stack - or remote ones on any OpenTelemetry backend - and feed the next spec-driven improvement loop."
      source: ./marketplace/oddyssey
      version: 1.13.0
      category: Observability
