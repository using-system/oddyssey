[project]
name = "oddyssey-mcp"
version = "1.11.0"
description = "Oddyssey MCP server: pilots the local observability stack for CLI coding agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp==2.1.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-httpx==0.65b0",
]

[project.scripts]
oddyssey-mcp = "oddyssey_mcp.server:main"

[project.urls]
Homepage = "https://github.com/using-system/oddyssey#readme"
Repository = "https://github.com/using-system/oddyssey"
Issues = "https://github.com/using-system/oddyssey/issues"
Changelog = "https://github.com/using-system/oddyssey/releases"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oddyssey_mcp"]

[tool.setuptools.package-dir]
oddyssey_mcp = "app"

[tool.pytest.ini_options]
addopts = ""
