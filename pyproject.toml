[project]
name = "oddyssey"
version = "0.1.0"
description = "Observability-driven development for CLI coding agents"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oddyssey"]
