name: ci-mcp-server

on:
  pull_request:
    paths:
      - "src/mcp-server/**"
      - "tests/mcp-server/**"
      - ".github/workflows/ci-mcp-server.yml"

env:
  RUFF_VERSION: "0.16.4"
  INSPECTOR_VERSION: "2.3.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Ruff lint
        run: uvx ruff@"$RUFF_VERSION" check src/mcp-server tests/mcp-server
      - name: Ruff format check
        run: uvx ruff@"$RUFF_VERSION" format --check src/mcp-server tests/mcp-server

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Sync project
        run: uv sync --project src/mcp-server
      - name: Run unit tests
        run: uv run --project src/mcp-server pytest -c src/mcp-server/pyproject.toml tests/mcp-server -v

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the MCP server
        run: uv sync --project src/mcp-server
      - name: "MCP client: the three stack tools are exposed"
        run: |
          npx -y @modelcontextprotocol/inspector@"$INSPECTOR_VERSION" --cli \
            src/mcp-server/.venv/bin/oddyssey-mcp --method tools/list > tools.json
          jq -e '[.tools[].name] | sort == ["odd_stack_down", "odd_stack_status", "odd_stack_up"]' tools.json
      - name: "MCP client: odd_stack_status reports down before start"
        run: |
          npx -y @modelcontextprotocol/inspector@"$INSPECTOR_VERSION" --cli \
            src/mcp-server/.venv/bin/oddyssey-mcp --method tools/call --tool-name odd_stack_status > status-down.json
          jq -e '.content[0].text | contains("\"running\": false")' status-down.json
      - name: "MCP client: odd_stack_up starts the real stack"
        env:
          # The tool call carries the whole cost on its own - image pull plus
          # stack startup - so the server's autonomy is what gets tested.
          MCP_SERVER_REQUEST_TIMEOUT: "420000"
        run: |
          npx -y @modelcontextprotocol/inspector@"$INSPECTOR_VERSION" --cli \
            src/mcp-server/.venv/bin/oddyssey-mcp --method tools/call --tool-name odd_stack_up > up.json
          jq -e '.content[0].text | contains("\"running\": true")' up.json
      - name: "MCP client: odd_stack_status confirms it is up"
        run: |
          npx -y @modelcontextprotocol/inspector@"$INSPECTOR_VERSION" --cli \
            src/mcp-server/.venv/bin/oddyssey-mcp --method tools/call --tool-name odd_stack_status > status-up.json
          jq -e '.content[0].text | contains("\"running\": true")' status-up.json
      - name: "MCP client: odd_stack_down stops it"
        run: |
          npx -y @modelcontextprotocol/inspector@"$INSPECTOR_VERSION" --cli \
            src/mcp-server/.venv/bin/oddyssey-mcp --method tools/call --tool-name odd_stack_down > down.json
          jq -e '.content[0].text | contains("\"running\": false")' down.json
          test -z "$(docker ps --filter name=oddyssey-lgtm --quiet)"
      - name: "MCP client: odd_stack_status confirms it is down"
        run: |
          npx -y @modelcontextprotocol/inspector@"$INSPECTOR_VERSION" --cli \
            src/mcp-server/.venv/bin/oddyssey-mcp --method tools/call --tool-name odd_stack_status > status-final.json
          jq -e '.content[0].text | contains("\"running\": false")' status-final.json
