name: ci-mcp-server

on:
  pull_request:
    paths:
      - "src/mcp-server/**"
      - "tests/mcp-server/**"
      - "integration-tests/mcp-server/**"
      - ".apm/skills/observability-cli-guides/references/builtin-stacks.md"
      - ".github/workflows/ci-mcp-server.yml"

# This workflow executes pull-request-controlled code (uv sync, pytest,
# the integration test-*.sh scripts): state least privilege here
# instead of relying on the repository default.
permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.4"
  INSPECTOR_VERSION: "2.3.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-suffix: ci-mcp-server-lint
      - name: Ruff lint
        run: uvx ruff@"$RUFF_VERSION" check src/mcp-server tests/mcp-server
      - name: Ruff format check
        run: uvx ruff@"$RUFF_VERSION" format --check src/mcp-server tests/mcp-server

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-suffix: ci-mcp-server-unit-tests
      - name: Sync project
        run: uv sync --project src/mcp-server
      - name: Run unit tests
        run: uv run --project src/mcp-server pytest -c src/mcp-server/pyproject.toml tests/mcp-server -v

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          cache-suffix: ci-mcp-server-integration
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the MCP server
        run: uv sync --project src/mcp-server
      - name: Run the integration tests
        run: bash integration-tests/mcp-server/run.sh

  odd-status:
    # The loop's verdict on the server, the way a consumer gets it: the
    # oddyssey-actions on this repository's own memory (.odd/), Copilot
    # on the actions' default model, the package at its latest release.
    # The run is billed to this repository, so it runs on its own PRs
    # only (a fork's PR gets no copilot-requests anyway); its verdict
    # table lands in the run's summary. Not a required check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # On the job: a step timeout does not reach a composite action's inner
    # steps, and the model run is one of them.
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The status reads git: each report's commit date and its
          # recorded revision against the commits after it - a shallow
          # clone grafts every report onto HEAD. No credential is left in
          # .git/config for a run that has a shell.
          fetch-depth: 0
          persist-credentials: false
      - uses: using-system/oddyssey-actions/setup-copilot@a8fb5c0ddb9f5641ead38d474add9aaeba75f3cb # v1.2.0
      - uses: using-system/oddyssey-actions/odd-status@a8fb5c0ddb9f5641ead38d474add9aaeba75f3cb # v1.2.0
        with:
          prompt: oddyssey-mcp
          fail-on: error
