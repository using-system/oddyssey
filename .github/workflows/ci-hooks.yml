name: ci-hooks

on:
  pull_request:
    paths:
      - ".apm/hooks/**"
      - "tests/hooks/**"
      - "scripts/build-marketplace.sh"
      - ".github/workflows/ci-hooks.yml"

# This workflow executes pull-request-controlled code (the hook scripts
# under test, and the apm install that deploys them): state least
# privilege here instead of relying on the repository default.
permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.4"
  APM_CLI_VERSION: "0.28.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Ruff lint
        run: uvx ruff@"$RUFF_VERSION" check .apm/hooks/scripts tests/hooks
      - name: Ruff format check
        run: uvx ruff@"$RUFF_VERSION" format --check .apm/hooks/scripts tests/hooks

  unit-tests:
    # A hook runs on whatever python3 the host machine has: test the
    # supported floor (3.10) and a current version.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run the hook tests
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv run --no-project --python "$PYTHON_VERSION" --with pytest pytest tests/hooks -v

  deploy:
    # apm must deploy the hook entry and its script on the two targets
    # the marketplaces serve; the other hooked targets are covered by
    # ci-apm's install matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Deploy for Claude Code and assert the hook landed
        run: |
          uvx --from apm-cli=="$APM_CLI_VERSION" apm install --target claude
          test -f .claude/hooks/oddyssey/scripts/guard_default_branch.py
          python3 - <<'EOF'
          import json
          hooks = json.load(open(".claude/settings.json"))["hooks"]["PreToolUse"]
          commands = [h["command"] for entry in hooks for h in entry["hooks"]]
          assert any("guard_default_branch.py" in c and c.endswith("PreToolUse") for c in commands), commands
          EOF
      - name: Run the deployed guard against a repository on its default branch
        # The checkout is a detached merge ref, so the probe repository is
        # built on the side: on main the guard must block, on a work
        # branch it must pass.
        run: |
          probe="$(mktemp -d)"
          git -C "$probe" init -q -b main
          git -C "$probe" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          payload='{"tool_input":{"command":"git commit -m x"},"cwd":"'"$probe"'"}'
          set +e
          echo "$payload" | python3 .claude/hooks/oddyssey/scripts/guard_default_branch.py PreToolUse
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "the guard answered $rc on the default branch, expected the block code 2" >&2; exit 1
          fi
          git -C "$probe" checkout -q -b docs/probe
          echo "$payload" | python3 .claude/hooks/oddyssey/scripts/guard_default_branch.py PreToolUse
          echo "the guard blocks on main and passes on a work branch"
      - name: Run the deployed scan against a report carrying a GUID
        run: |
          probe="$(mktemp -d)"
          mkdir -p "$probe/.odd"
          printf 'workspace 3f2a9c1e-7b4d-4e8a-9c21-5d6e7f8a9b0c\n' > "$probe/.odd/r.md"
          payload='{"tool_name":"Write","tool_input":{"file_path":"'"$probe"'/.odd/r.md"},"cwd":"'"$probe"'"}'
          set +e
          echo "$payload" | python3 .claude/hooks/oddyssey/scripts/scan_odd_identifiers.py PostToolUse
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "the scan answered $rc on a report carrying a GUID, expected 2" >&2; exit 1
          fi
          printf 'clean line\n' > "$probe/.odd/r.md"
          echo "$payload" | python3 .claude/hooks/oddyssey/scripts/scan_odd_identifiers.py PostToolUse
          echo "the scan flags a GUID and passes a clean report"
      - name: Deploy for Codex and assert the hook landed
        run: |
          uvx --from apm-cli=="$APM_CLI_VERSION" apm install --target codex
          test -f .codex/hooks/oddyssey/scripts/guard_default_branch.py
          python3 - <<'EOF'
          import json
          hooks = json.load(open(".codex/hooks.json"))["hooks"]["PreToolUse"]
          commands = [h["command"] for entry in hooks for h in entry["hooks"]]
          assert any("guard_default_branch.py" in c and c.endswith("PreToolUse") for c in commands), commands
          EOF

  marketplace:
    # The plugin bundle must carry hooks/hooks.json with plugin-root
    # paths and the scripts they name: apm pack does neither, the build
    # script does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build the marketplace and assert the plugin carries the hooks
        run: |
          bash scripts/build-marketplace.sh
          test -f marketplace/oddyssey/hooks/hooks.json
          test ! -e marketplace/oddyssey/hooks.json
          for script in guard_default_branch scan_odd_identifiers; do
            grep -qF "\\\"\${CLAUDE_PLUGIN_ROOT}\\\"/hooks/scripts/${script}.py" marketplace/oddyssey/hooks/hooks.json
            test -f "marketplace/oddyssey/hooks/scripts/${script}.py"
          done
