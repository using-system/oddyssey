name: ci-apm

on:
  pull_request:

# This workflow executes pull-request-controlled code (apm install over
# the PR's tree): state least privilege here instead of relying on the
# repository default.
permissions:
  contents: read

env:
  APM_CLI_VERSION: "0.28.0"

jobs:
  reference-contract:
    # Every stack reference carries the sections the preflight, the switch
    # and the agents read by heading (references/CONTRACT.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the references against the contract
        run: python3 .apm/skills/observability-cli-guides/scripts/check_stack_reference.py

  validate:
    # grok-build is excluded from the matrix: it has no MCP client, and
    # this package declares an MCP server, which apm rightly refuses.
    strategy:
      fail-fast: false
      matrix:
        target:
          [claude, copilot, cursor, codex, gemini, opencode, windsurf, kiro]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: ci-apm-validate-${{ matrix.target }}
      - name: Consumer install, materialized tree in the run summary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          dir="$(mktemp -d)"
          git init -q "$dir/consumer"
          cd "$dir/consumer"
          uvx --from apm-cli=="$APM_CLI_VERSION" apm install "$GITHUB_WORKSPACE" --target "$TARGET"
          {
            echo "### apm install --target ${TARGET}"
            echo ""
            echo '```text'
            # Filenames come from the PR: indent every line so a fence
            # marker can never sit at line start (a closing fence
            # tolerates at most three leading spaces).
            git ls-files --others | grep -v '^apm_modules/' | sort | sed 's/^/    /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate the package's own manifest (install + audit)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          uvx --from apm-cli=="$APM_CLI_VERSION" apm install --target "$TARGET"
          uvx --from apm-cli=="$APM_CLI_VERSION" apm audit
