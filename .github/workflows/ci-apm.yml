name: ci-apm

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

env:
  APM_CLI_VERSION: "0.28.0"

jobs:
  validate-manifest:
    # Runs only when the PR carries the validate-apm label: apm resolution
    # is slower and network-bound, so it is opt-in per PR.
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'validate-apm')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Consumer install for every target, tree in the run summary
        run: |
          echo "## apm install — files materialized per target" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for target in claude copilot cursor codex gemini grok-build opencode windsurf kiro; do
            dir="$(mktemp -d)"
            git init -q "$dir/consumer"
            (
              cd "$dir/consumer"
              uvx --from apm-cli=="$APM_CLI_VERSION" apm install "$GITHUB_WORKSPACE" --target "$target"
              {
                echo "<details><summary><b>${target}</b></summary>"
                echo ""
                echo '```text'
                git ls-files --others | grep -v '^apm_modules/' | sort
                echo '```'
                echo "</details>"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            )
            rm -rf "$dir"
          done
      - name: Validate the package's own manifest (install + audit)
        run: |
          uvx --from apm-cli=="$APM_CLI_VERSION" apm install --target claude
          uvx --from apm-cli=="$APM_CLI_VERSION" apm audit
