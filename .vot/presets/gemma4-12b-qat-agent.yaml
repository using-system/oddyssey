name: gemma4-12b-qat-agent
description: Gemma 4 12B QAT 4-bit (compressed-tensors, w4a16) tuned for coding-agent CLIs on one A100 80 GB - full 256k context, tool calling, text only; NVIDIA stacks only
model: google/gemma-4-12B-it-qat-w4a16-ct
served_model_name: gemma4-12b-agent
gpu_memory_gb: 48
vllm_args:
  --max-model-len: 262144
  --gpu-memory-utilization: 0.92
  --max-num-seqs: 8
  --max-num-batched-tokens: 16384
  --enable-prefix-caching: true
  --language-model-only: true
  --enable-auto-tool-choice: true
  --tool-call-parser: gemma4
  --reasoning-parser: gemma4
env: []
